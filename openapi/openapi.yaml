openapi: 3.1.0
info:
  title: Argvio Metrics API
  version: "1.0.0"
  description: >
    Read-oriented REST API for querying ingested CLI telemetry: raw span
    listing, a distinct-dimension-values lookup, and pre-aggregated
    dashboard queries (mostly backed by TimescaleDB continuous
    aggregates). Every request is scoped to exactly
    one tenant, derived from the caller's auth token — there is no way to
    request another tenant's data (see the `security` section and
    docs/architecture.md).

    **Authentication.** Send `Authorization: Bearer <token>`. The token is
    opaque to the caller; the server decides how to verify it: an
    `argv_…` API key, an HS256 session JWT, or an OAuth2 access token from
    the configured OIDC provider (a JWT, or an opaque token verified by
    RFC 7662 introspection). A dashboard user's identity maps to tenants
    through memberships (`argvio tenant member add`), not through a token
    claim. A user with several memberships selects one per request with the
    `X-Argvio-Tenant` header; see `GET /v1/tenants`.

    Errors a client must tell apart: **401** with `WWW-Authenticate: Bearer
    error="invalid_token"` means the token is bad or expired (re-authenticate);
    **403** (`no_tenant_access`, `insufficient_scope`) means the caller is
    authenticated but not allowed (do *not* re-authenticate); **400
    `tenant_required`** means the identity has several tenants and the request
    named none; **503** means the identity provider is unreachable, which says
    nothing about the token.

    This spec covers the `metrics` server only. The `public` server is a
    spec-compliant OTLP receiver (gRPC + HTTP), documented by reference to
    the OpenTelemetry Protocol specification in docs/architecture.md rather
    than duplicated here.
  license:
    name: Proprietary

servers:
  - url: https://metrics.argvio.internal
    description: Production (internal/trusted-tenant network only)
  - url: http://localhost:8080
    description: Local development

security:
  - BearerJWT: []
  - BearerAPIKey: []
  - BearerOIDC: []

paths:
  /healthz:
    get:
      summary: Liveness check
      operationId: healthz
      security: []
      responses:
        "200":
          description: Server is up.
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /v1/tenants:
    get:
      summary: List the caller's tenants
      description: >
        The tenants the authenticated OIDC user is a member of, i.e. the values
        accepted by the `X-Argvio-Tenant` header on every other `/v1/*` call.
        Needs no tenant selection itself and ignores the header, so a client
        calls it right after sign-in to decide which tenant to use. A user
        with no memberships gets an empty array (not an error) so the dashboard
        can show a "no access" screen. The body is a bare array, not the
        `{"data": ...}` envelope the query endpoints use.

        Only an OIDC identity has memberships: an API key or HS256 session JWT
        is already bound to one tenant and gets 403.

        A deployment may recognise some identities as admins (see
        `docs/architecture.md`). For one, this lists every *active* tenant
        with the admin's configured role (`viewer` unless `auth.admin.role` or
        `auth.admin.role_claim` says otherwise), with no `tenant_members` rows
        behind it.
      operationId: listTenants
      security:
        - BearerOIDC: []
      responses:
        "200":
          description: The caller's memberships, ordered by tenant name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantMembership"
              example:
                - { id: "5e35bea9-11a3-4c64-a1dc-8a97ce3f0783", name: "Acme", role: admin }
                - { id: "0b1f2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d", name: "Beta", role: viewer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/traces:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: List raw spans
      description: >
        Drill-down query behind the aggregate endpoints below. Paginated,
        newest first. For dashboard-scale time series, use
        /v1/metrics/latency, /v1/metrics/error-rate, or
        /v1/metrics/command-frequency instead of paging through this.
      operationId: listTraces
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/Command"
        - $ref: "#/components/parameters/ExitCode"
        - $ref: "#/components/parameters/IsCI"
        - $ref: "#/components/parameters/AttrFilter"
        - $ref: "#/components/parameters/AttrContainsFilter"
        - $ref: "#/components/parameters/AttrInFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Matching spans.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TraceSummary"
              example:
                data:
                  - time: "2026-08-12T14:23:49Z"
                    trace_id: "ed6651f361204ea8a9b1e0f9cf092661"
                    span_id: "0102030405060708"
                    span_name: "cli.command.deploy"
                    duration_ms: 142.5
                    status_code: 1
                    command_name: "deploy"
                    exit_code: 0
                    cli_version: "1.4.2"
                    os: "linux"
                    arch: "amd64"
                    is_ci: false
                    consent_tier: "basic"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"


  /v1/meta/dimensions:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: Distinct filter values the tenant has data for
      description: >
        Source for dashboard filter option lists. Takes no time range —
        lists every value present in the tenant's daily rollups. Each list
        is sorted and capped at max_result_page_size values.
      operationId: listDimensions
      responses:
        "200":
          description: Distinct values per filter dimension.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Dimensions"
              example:
                data:
                  cli_version: ["1.4.1", "1.4.2"]
                  os: ["darwin", "linux"]
                  arch: ["amd64", "arm64"]
                  command_name: ["deploy", "status"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/metrics/latency:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: Command latency percentiles (p50/p95/p99), time-bucketed
      operationId: latencyPercentiles
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/Command"
        - $ref: "#/components/parameters/IsCI"
        - $ref: "#/components/parameters/Bucket"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Per-bucket, per-command percentile latencies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LatencyPoint"
              example:
                data:
                  - bucket: "2026-08-12T00:00:00Z"
                    command_name: "deploy"
                    invocation_count: 483
                    p50_ms: 118.2
                    p95_ms: 340.7
                    p99_ms: 812.4
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/metrics/resource-usage:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: Peak memory and CPU time percentiles per command and version, time-bucketed
      description: |
        p50/p95/p99 of `cli.process.peak_rss_bytes` and `cli.process.cpu_time_ms`
        per command and CLI version, from the same kind of mergeable sketches as
        `/v1/metrics/latency` (so day/week/month buckets are true percentiles over
        the period, not averages of hourly ones).

        Only runs that reported a measure are sampled: zero, negative, implausibly
        large and missing values count as "not reported" (SDKs on platforms that
        cannot measure omit them). Each measure carries `reported_count`, the
        sample size behind its percentiles; `invocation_count - reported_count`
        is how many runs did not report it. When `reported_count` is 0 the
        percentiles are absent.

        Both attributes are basic-tier: runs captured at the `anonymous` tier
        do not report them and count only toward `invocation_count`.
      operationId: resourceUsage
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/Command"
        - $ref: "#/components/parameters/IsCI"
        - $ref: "#/components/parameters/Bucket"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Per-bucket, per-command, per-version resource usage percentiles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResourceUsagePoint"
              example:
                data:
                  - bucket: "2026-08-12T00:00:00Z"
                    command_name: "deploy"
                    cli_version: "1.4.2"
                    invocation_count: 483
                    peak_rss_bytes:
                      reported_count: 430
                      p50: 52428800
                      p95: 104857600
                      p99: 209715200
                    cpu_time_ms:
                      reported_count: 430
                      p50: 120
                      p95: 410
                      p99: 980
                  - bucket: "2026-08-12T00:00:00Z"
                    command_name: "deploy"
                    cli_version: "1.3.0"
                    invocation_count: 37
                    peak_rss_bytes:
                      reported_count: 0
                    cpu_time_ms:
                      reported_count: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/metrics/version-footprint:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: Binary size and startup overhead per CLI version
      description: |
        How a CLI's executable size and startup cost change from release to release,
        one row per `cli.version` over the window, oldest version first.

        Binary size (`cli.binary.size_bytes`) is a property of a build, and startup
        overhead (`cli.startup.duration_ms`, process start to the point the command
        begins running) is once per process, so both ride on `cli.session.started`
        rather than on every command. Size reports median, min and max; startup
        reports p50 and p95. Percentiles come from mergeable sketches, so they are
        true percentiles over the whole window (approximate, within a few percent),
        not averages of daily ones. Min and max are exact. Size min/max spread across
        the os/arch builds of a version, so filter with `os` and `arch` to compare
        like with like.

        Only sessions that reported a measure are sampled. Each measure carries
        `reported_sessions`, the sample size behind its figures, and
        `reported_installs`, the approximate number of distinct installs behind those
        sessions (only basic tier or above carries an install id). The binary size is
        optional, as runtimes with no single binary omit it. `session_count -
        reported_sessions` is how many sessions did not report a measure. When
        `reported_sessions` is 0 the figures are absent. Missing, negative and
        implausibly large values are treated as not reported at ingest (size must be
        above 0 and at most 4 GiB; startup 0 to 1 hour, where 0 is a real
        sub-millisecond start), so one faulty client cannot skew a version's figures.

        Versions are ordered by semantic version (`1.9.0` before `1.10.0`, a
        prerelease before its release). Versions that do not parse as semver, such as
        `nightly`, follow in string order, then sessions that reported no version
        (`cli_version` null). The order is applied before `limit` and `offset`.

        Both attributes are basic tier: sessions captured at the `anonymous` tier
        count only toward `session_count`.

        Built from `cli.session.started` logs, so it is bounded by log retention
        (about 90 days by default): history older than that exists only for days
        already rolled up, and cannot be rebuilt once the raw logs are gone. These
        are per-session figures, so the `command` filter does not apply.
      operationId: versionFootprint
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/IsCI"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One row per CLI version, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/VersionFootprintPoint"
              example:
                data:
                  - cli_version: "1.9.0"
                    session_count: 1840
                    binary_size_bytes:
                      reported_sessions: 1790
                      reported_installs: 412
                      median: 18874368
                      min: 18350080
                      max: 19922944
                    startup_duration_ms:
                      reported_sessions: 1790
                      reported_installs: 412
                      p50: 38
                      p95: 120
                  - cli_version: "1.10.0"
                    session_count: 3120
                    binary_size_bytes:
                      reported_sessions: 3050
                      reported_installs: 655
                      median: 21495808
                      min: 20971520
                      max: 22544384
                    startup_duration_ms:
                      reported_sessions: 3050
                      reported_installs: 655
                      p50: 52
                      p95: 180
                  - cli_version: "nightly"
                    session_count: 14
                    binary_size_bytes:
                      reported_sessions: 0
                      reported_installs: 0
                    startup_duration_ms:
                      reported_sessions: 0
                      reported_installs: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/metrics/error-rate:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: Error rate over time, per command
      operationId: errorRateSeries
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/Command"
        - $ref: "#/components/parameters/IsCI"
        - $ref: "#/components/parameters/Bucket"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Per-bucket, per-command invocation/error counts and rate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ErrorRatePoint"
              example:
                data:
                  - bucket: "2026-08-12T00:00:00Z"
                    command_name: "deploy"
                    invocation_count: 483
                    error_count: 12
                    error_rate: 0.0248
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/metrics/command-frequency:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: Command invocation frequency histogram, time-bucketed
      operationId: commandFrequency
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/Command"
        - $ref: "#/components/parameters/IsCI"
        - $ref: "#/components/parameters/Bucket"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Per-bucket, per-command invocation counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FrequencyPoint"
              example:
                data:
                  - bucket: "2026-08-12T00:00:00Z"
                    command_name: "deploy"
                    invocation_count: 483
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/metrics/cohorts:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: Session/activation cohort counts, time-bucketed (day or coarser)
      operationId: sessionCohorts
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/IsCI"
        - $ref: "#/components/parameters/DailyBucket"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Per-bucket session counts, broken down by cli_version/os/arch.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CohortPoint"
              example:
                data:
                  - bucket: "2026-08-12T00:00:00Z"
                    cli_version: "1.4.2"
                    os: "linux"
                    arch: "amd64"
                    session_count: 217
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/metrics/exit-codes:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: Invocation counts per exit code, per command, time-bucketed
      description: >
        Error-type breakdown: the command-stats endpoints only expose an
        errored/not-errored count, this one splits it by exit_code.
      operationId: exitCodeDistribution
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/Command"
        - $ref: "#/components/parameters/ExitCode"
        - $ref: "#/components/parameters/IsCI"
        - $ref: "#/components/parameters/Bucket"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Per-bucket, per-command, per-exit-code invocation counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExitCodePoint"
              example:
                data:
                  - bucket: "2026-08-12T00:00:00Z"
                    command_name: "deploy"
                    exit_code: 2
                    invocation_count: 9
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/metrics/error-types:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: Error counts per error category, per command, time-bucketed
      description: >
        Distribution of the coarse, vendor-assigned error category
        (user, validation, network, auth, internal, timeout, canceled,
        unknown) carried by cli.error.raised events. Backs the network-vs-local
        and timeout views. Counts only commands whose SDK emitted that event,
        which requires a high enough consent tier, so totals are lower than
        /v1/metrics/error-rate. Reads raw logs, so it is bounded by log
        retention. exit_code and attr.* filters do not apply.
      operationId: errorTypes
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/Command"
        - $ref: "#/components/parameters/IsCI"
        - $ref: "#/components/parameters/Bucket"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Per-bucket, per-command, per-error-type counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ErrorTypePoint"
              example:
                data:
                  - bucket: "2026-08-12T00:00:00Z"
                    command_name: "deploy"
                    error_type: "network"
                    error_count: 4
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/metrics/friction:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: Help views and interrupted runs per command, time-bucketed
      description: >
        Signals that a command is hard to use, next to its invocation count so
        rates can be computed. help_views counts cli.help.viewed events (raw
        logs, bounded by log retention) and can be non-zero for a command
        with no invocations. interrupted_count counts invocations that exited
        130 (SIGINT, i.e. Ctrl+C); it is a lower bound, since a CLI is not
        required to exit 130 when interrupted. exit_code and attr.* filters do
        not apply.
      operationId: friction
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/Command"
        - $ref: "#/components/parameters/IsCI"
        - $ref: "#/components/parameters/Bucket"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Per-bucket, per-command friction counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FrictionPoint"
              example:
                data:
                  - bucket: "2026-08-12T00:00:00Z"
                    command_name: "deploy"
                    invocation_count: 120
                    help_views: 18
                    interrupted_count: 3
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/metrics/install-funnel:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: "Install funnel (first seen, ran a command, first success), by cohort"
      description: >
        Of the installs first seen in each bucket, how many have since completed a
        command and how many have had a command exit 0. Later stages are counted
        whenever they happened, even after the window, so recent cohorts are still
        maturing.
        Install-level, so only installs that reported a cli.install_id (basic
        consent tier or above) appear; see /v1/metrics/install-coverage for how
        much traffic that is. Installs are grouped by the bucket they were first
        seen in, and the window applies to that first sighting. cli_version means
        "first seen on this version"; os and arch are the install's most recent
        values; command and is_ci filters do not apply. Install state is purged
        once an install has not been seen for the tenant's logs retention, so an
        install returning after that counts as new.
      operationId: installFunnel
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/InstallBucket"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One row per bucket (per version pair for version-changes).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FunnelPoint"
              example:
                data:
                  - bucket: "2026-08-10T00:00:00Z"
                    installs: 120
                    ran_command: 97
                    succeeded: 71
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/metrics/install-activation:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: Time from first seen to first successful command, by cohort
      description: >
        Per cohort bucket: the cohort size, how many installs have activated
        (first command exited 0), and p50/p90 seconds from first sighting to first
        success. Percentiles cover activated installs only, so they describe how
        fast the successful ones were, not how long the rest will take; compare
        activated_count with cohort_size. They are null when nobody has activated.
        Install-level, so only installs that reported a cli.install_id (basic
        consent tier or above) appear; see /v1/metrics/install-coverage for how
        much traffic that is. Installs are grouped by the bucket they were first
        seen in, and the window applies to that first sighting. cli_version means
        "first seen on this version"; os and arch are the install's most recent
        values; command and is_ci filters do not apply. Install state is purged
        once an install has not been seen for the tenant's logs retention, so an
        install returning after that counts as new.
      operationId: installActivation
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/InstallBucket"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One row per bucket (per version pair for version-changes).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActivationPoint"
              example:
                data:
                  - bucket: "2026-08-10T00:00:00Z"
                    cohort_size: 120
                    activated_count: 71
                    p50_seconds: 42.5
                    p90_seconds: 3600
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/metrics/feature-discovery:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: How quickly installs discover each feature and flag after first being seen
      description: >
        An install discovers a feature the first time it emits cli.feature.activated
        for it (named by cli.activation.feature), and a flag the first time a
        cli.command.invoked carries its name in cli.flag.names. Time to discovery is
        that first use minus the install's first_seen, so it is measured from when
        argvio first saw the install, not from when it was installed.


        The cohort is the installs first seen in the window (like
        /v1/metrics/install-funnel). Per feature or flag: installs is how many of the
        cohort have ever used it, discovered_within_1d/7d/30d how many did so within
        that long of first_seen (divide by cohort_size for the share of the cohort),
        and median_seconds the median time to discovery. Discoveries count whenever
        they happened, even after the window, so recent cohorts are still maturing and
        their within-N-day shares understate the eventual figure; choose a window that
        ended at least N days ago for a fair N-day share. The median covers
        discoverers only, so it says how fast the ones who found it were, not how long
        the rest will take. A feature nobody used is absent, not zero.


        Names are vendor-supplied strings, so the response is bounded: limit and
        offset apply per kind to the ranking by installs (ties by name), and
        max_result_page_size caps limit. Without kind, features and flags are both
        returned, each ranked on its own and features first.


        First uses are recorded at ingest and kept for as long as the install itself
        (purged once an install has not been seen for the tenant's logs retention, so
        an install returning after that counts as new), so unlike log-backed metrics
        this is not bounded by log retention. Events from before the tracking existed
        can only be rebuilt from retained logs (argvio installs backfill); an install
        whose real first use is older than that looks later than it was.


        Install-level, so only installs that reported a cli.install_id (basic consent
        tier or above) appear; see /v1/metrics/install-coverage for how much traffic
        that is. cli_version means "first seen on this version"; os and arch are the
        install's most recent values; command and is_ci filters do not apply. SDKs
        must emit cli.feature.activated with cli.install_id for features to appear.
      operationId: featureDiscovery
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/DiscoveryKind"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One row per feature or flag, features first, each kind ranked by installs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DiscoveryPoint"
              example:
                data:
                  - kind: feature
                    name: deploy
                    cohort_size: 120
                    installs: 84
                    discovered_within_1d: 40
                    discovered_within_7d: 70
                    discovered_within_30d: 81
                    median_seconds: 7200
                  - kind: flag
                    name: "--dry-run"
                    cohort_size: 120
                    installs: 31
                    discovered_within_1d: 6
                    discovered_within_7d: 15
                    discovered_within_30d: 27
                    median_seconds: 432000
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/metrics/install-methods:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: "Installs by install method, by cohort"
      description: >
        Of the installs first seen in each bucket, how many report each install
        method (brew, npm, curl, binary, ...). The method is supplied by the CLI
        vendor through the SDK's install-method option, so installs that never
        reported one, including everything seen before the vendor set it, are
        grouped under a null install_method. Install-level, so only installs that
        reported a cli.install_id (basic consent tier or above) appear; see
        /v1/metrics/install-coverage. The window applies to an install's first
        sighting; cli_version means "first seen on this version"; os and arch are
        the install's most recent values; command and is_ci filters do not apply.
      operationId: installMethods
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/InstallBucket"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One row per bucket (per bucket and install method for install-methods).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/InstallMethodPoint"
              example:
                data:
                  - bucket: "2026-08-10T00:00:00Z"
                    install_method: "brew"
                    installs: 64
                  - bucket: "2026-08-10T00:00:00Z"
                    install_method: null
                    installs: 12
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/metrics/new-vs-returning:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: "Active installs split into new and returning, time-bucketed"
      description: >
        Distinct installs that started a session in each bucket, split by whether
        the install was first seen in that same bucket (new) or earlier
        (returning). Reads raw session logs, so it is bounded by log retention, and
        installs with no install-state row (not yet backfilled, or purged after
        install retention) are left out, so "new" means first seen within install
        retention. Only sessions that reported a cli.install_id (basic consent tier
        or above) count. Filters apply to the sessions themselves; command does not
        apply.
      operationId: newVsReturning
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/IsCI"
        - $ref: "#/components/parameters/InstallBucket"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One row per bucket (per bucket and install method for install-methods).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NewReturningPoint"
              example:
                data:
                  - bucket: "2026-08-10T00:00:00Z"
                    new_installs: 48
                    returning_installs: 212
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/metrics/version-changes:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: Upgrades and downgrades between versions, time-bucketed
      description: >
        Installs observed moving from one CLI version to another, with direction
        decided by semver comparison. Changes involving a version that is not
        semver are not recorded. Only installs that reported a cli.install_id
        appear. The window applies to when the change was observed; cli_version
        filters on the version moved to, os and arch on the install's most recent
        values; command and is_ci filters do not apply.
      operationId: versionChanges
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/InstallBucket"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One row per bucket (per version pair for version-changes).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/VersionChangePoint"
              example:
                data:
                  - bucket: "2026-08-10T00:00:00Z"
                    from_version: "1.4.0"
                    to_version: "1.5.0"
                    direction: upgrade
                    changes: 31
                    installs: 31
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/metrics/install-coverage:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: Share of sessions that the install-based metrics can see
      description: >
        Per bucket: all session starts, and those carrying a cli.install_id (basic
        consent tier or above). Divide to show how representative the funnel,
        activation and version-change endpoints are. Reads raw logs, so it is
        bounded by log retention. command and exit_code filters do not apply.
      operationId: installCoverage
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/IsCI"
        - $ref: "#/components/parameters/DailyBucket"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One row per bucket (per version pair for version-changes).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CoveragePoint"
              example:
                data:
                  - bucket: "2026-08-12T00:00:00Z"
                    session_count: 800
                    tracked_sessions: 560
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/metrics/ci-split:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: Command invocations split by CI vs. interactive, time-bucketed
      description: >
        One grouped-by-is_ci response instead of querying
        /v1/metrics/command-frequency once per is_ci value.
      operationId: ciSplit
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/Command"
        - $ref: "#/components/parameters/IsCI"
        - $ref: "#/components/parameters/Bucket"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Per-bucket invocation counts, one row per is_ci value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CISplitPoint"
              example:
                data:
                  - bucket: "2026-08-12T00:00:00Z"
                    is_ci: true
                    invocation_count: 1204
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/metrics/active-installs:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: Active installs (DAU/WAU/MAU), time-bucketed
      description: >
        Approximate distinct cli.install_id count per bucket: bucket=day is
        DAU, week WAU, month MAU. Per-day HyperLogLog sketches are unioned,
        so an install active on several days of a week counts once. Only
        sessions recorded at basic consent tier or above carry an install
        id, so anonymous-tier usage is not counted here (it still counts in
        /v1/metrics/cohorts session totals).
      operationId: activeInstalls
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/IsCI"
        - $ref: "#/components/parameters/DailyBucket"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Per-bucket approximate active-install count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActiveInstallsPoint"
              example:
                data:
                  - bucket: "2026-08-10T00:00:00Z"
                    active_installs: 1832
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/metrics/retention:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      summary: Install retention by cohort
      description: >
        Cohort grid: installs are grouped by the bucket (default week) they
        were first seen in, for cohorts starting within [from, to), and
        counted again in each later bucket they started a session in, up
        to `to`. First-seen is computed from raw session logs, so it is
        bounded by raw log retention, and only basic-tier-or-above sessions
        (which carry cli.install_id) are included. Dimension filters
        restrict which sessions count — e.g. cli_version gives "first seen
        on this version" cohorts.
      operationId: retentionByCohort
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/CLIVersion"
        - $ref: "#/components/parameters/OS"
        - $ref: "#/components/parameters/Arch"
        - $ref: "#/components/parameters/IsCI"
        - $ref: "#/components/parameters/RetentionBucket"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One row per (cohort, period) cell, ordered by cohort then period.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RetentionPoint"
              example:
                data:
                  - cohort: "2026-08-03T00:00:00Z"
                    period: 1
                    cohort_size: 240
                    retained_installs: 131
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Dashboard-user session token. Must carry a `tenant_id` claim (the
        UUID of the tenant this session is scoped to) and a standard `exp`.
        Signed HS256; the server pins the algorithm explicitly and rejects
        any other `alg`, including `none`.
    BearerAPIKey:
      type: http
      scheme: bearer
      description: >
        A scoped API key issued with scope=metrics_query (see
        `argvio apikey create --scope metrics_query`). Distinct from
        the public server's ingest keys (scope=public_ingest) — an ingest
        key is rejected here and vice versa.
    BearerOIDC:
      type: http
      scheme: bearer
      description: >
        OAuth2 access token from the configured OIDC provider
        (`auth.oidc.*`; requires `oidc` in `auth.methods`). The client treats
        it as opaque; the server verifies it one of two ways, chosen by the
        token's shape.

        **JWT access token** (three-part JWS with an asymmetric `alg`,
        RS*/PS*/ES*; `none` and HMAC are rejected). Verified against the
        provider's JWKS from its `/.well-known/openid-configuration`. Needs
        `iss` equal to the discovery `issuer` byte for byte (trailing slash
        included), `aud` containing `auth.oidc.audience`, `exp`, and, if
        `auth.oidc.required_scopes` is set, every scope in `scope`/`scp`. With
        `auth.oidc.require_access_token_typ`, a `typ` header other than
        `at+jwt` (RFC 9068) is rejected, which keeps ID tokens out.
        `auth.oidc.audience` must be a resource identifier for this API and
        must never equal an SPA's `client_id`; an ID token's `aud` is the
        client_id, so that is what stops an ID token being accepted.

        **Opaque token** (anything else not starting with `argv_`), when
        `auth.oidc.introspection.enabled`. Verified with the provider's RFC 7662
        introspection endpoint: accepted only if `active`, `aud` contains the
        audience, `iss` (if present) matches, `exp`/`nbf` are valid and the
        required scopes are present. Results are cached, so a token revoked at
        the provider can still be accepted for up to
        `auth.oidc.introspection.cache_ttl`.

        The token identifies a user, not a tenant: the verified `(iss, sub)` is
        looked up in `tenant_members`. One membership is used automatically;
        several require `X-Argvio-Tenant`. A `tenant_id` claim, if present,
        must itself be a membership.

  parameters:
    TenantHeader:
      name: X-Argvio-Tenant
      in: header
      required: false
      description: >
        UUID of the tenant this request is for. Optional for a caller with
        exactly one tenant; required (else 400 `tenant_required`) for an OIDC
        user with several memberships. It can only select among tenants the
        caller already belongs to: any other value is 403 `no_tenant_access`,
        for an API key or session JWT too. An admin identity may select any
        active tenant; an unknown or inactive one is still 403
        `no_tenant_access`. List the choices with `GET /v1/tenants`.
      schema: { type: string, format: uuid }
    From:
      name: from
      in: query
      required: true
      description: Start of the query window, inclusive. RFC3339.
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      required: false
      description: End of the query window, exclusive. RFC3339. Defaults to now.
      schema: { type: string, format: date-time }
    # cli_version / os / arch / command are multi-value: repeat the key
    # (`os=linux&os=darwin`) or comma-separate (`os=linux,darwin`), or mix
    # both. Values within one param are ORed; distinct params are ANDed
    # (same as attr.*).
    CLIVersion:
      name: cli_version
      in: query
      required: false
      description: Exact cli_version match; multi-value (OR).
      style: form
      explode: true
      schema: { type: array, items: { type: string } }
    OS:
      name: os
      in: query
      required: false
      description: Multi-value (OR).
      style: form
      explode: true
      schema: { type: array, items: { type: string, enum: [linux, darwin, windows, other] } }
    Arch:
      name: arch
      in: query
      required: false
      description: Multi-value (OR).
      style: form
      explode: true
      schema: { type: array, items: { type: string, enum: ["amd64", "arm64", "386", "arm", "other"] } }
    Command:
      name: command
      in: query
      required: false
      description: Exact command_name match; multi-value (OR).
      style: form
      explode: true
      schema: { type: array, items: { type: string } }
    ExitCode:
      name: exit_code
      in: query
      required: false
      schema: { type: integer, format: int32 }
    IsCI:
      name: is_ci
      in: query
      required: false
      schema: { type: boolean }
    Bucket:
      name: bucket
      in: query
      required: false
      description: >
        Time-bucket granularity. hour/day read the matching rollup
        directly; week (ISO, Monday start) and month are rolled up from
        daily data at query time. All boundaries are UTC.
      schema: { type: string, enum: [hour, day, week, month], default: hour }
    DailyBucket:
      name: bucket
      in: query
      required: false
      description: >
        Time-bucket granularity for endpoints backed by daily session data
        (no hour). week starts Monday; all boundaries are UTC.
      schema: { type: string, enum: [day, week, month], default: day }
    InstallBucket:
      name: bucket
      in: query
      required: false
      description: Cohort or change granularity. week starts Monday; all boundaries are UTC.
      schema: { type: string, enum: [day, week, month], default: week }
    DiscoveryKind:
      name: kind
      in: query
      required: false
      description: Restrict to features or flags. Omit for both.
      schema: { type: string, enum: [feature, flag] }
    RetentionBucket:
      name: bucket
      in: query
      required: false
      description: Cohort and period granularity. week starts Monday; all boundaries are UTC.
      schema: { type: string, enum: [day, week, month], default: week }
    AttrFilter:
      name: attr.*
      in: query
      required: false
      description: >
        Exact-match filter against a record-level attribute, e.g.
        `attr.cli.ci_provider=github_actions`. Repeatable with different
        keys (ANDed together). Values are always bound as query parameters
        server-side — never string-concatenated into SQL — so arbitrary
        attribute values cannot be used for injection.
      schema: { type: string }
    AttrContainsFilter:
      name: attr_contains.*
      in: query
      required: false
      description: >
        Substring filter against a record-level attribute, e.g.
        `attr_contains.cli.ci_provider=github`. Case-sensitive; an empty
        value is ignored. Repeatable with different keys; ANDed with every
        other filter, including `attr.*` and `attr_in.*` on the same key.
        Bound as a query parameter server-side, like `attr.*`.
      schema: { type: string }
    AttrInFilter:
      name: attr_in.*
      in: query
      required: false
      description: >
        Set-membership filter against a record-level attribute, e.g.
        `attr_in.cli.ci_provider=github_actions,gitlab_ci`. Accepts repeated
        or comma-separated values (OR within the key); ANDed across keys and
        with every other filter. Bound as a query parameter server-side.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Clamped server-side to MetricsConfig.max_result_page_size.
      schema: { type: integer, minimum: 1, default: 100 }
    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }

  schemas:
    TraceSummary:
      type: object
      properties:
        time: { type: string, format: date-time }
        trace_id: { type: string }
        span_id: { type: string }
        span_name: { type: string }
        duration_ms: { type: number }
        status_code: { type: integer, description: "OTLP Status.code: 0 unset, 1 ok, 2 error" }
        status_message: { type: string, nullable: true }
        command_name: { type: string, nullable: true }
        exit_code: { type: integer, nullable: true }
        cli_version: { type: string, nullable: true }
        os: { type: string, nullable: true }
        arch: { type: string, nullable: true }
        is_ci: { type: boolean, nullable: true }
        consent_tier: { type: string, enum: [anonymous, basic, full, optin_plus] }
      required: [time, trace_id, span_id, span_name, duration_ms, status_code, consent_tier]

    LatencyPoint:
      type: object
      properties:
        bucket: { type: string, format: date-time }
        command_name: { type: string }
        invocation_count: { type: integer }
        p50_ms: { type: number, nullable: true }
        p95_ms: { type: number, nullable: true }
        p99_ms: { type: number, nullable: true }
      required: [bucket, command_name, invocation_count]

    UsageStats:
      type: object
      description: Distribution of one resource measure over the runs that reported it.
      properties:
        reported_count: { type: integer, description: "Runs that reported this measure; the sample size behind the percentiles." }
        p50: { type: number }
        p95: { type: number }
        p99: { type: number }
      required: [reported_count]

    ResourceUsagePoint:
      type: object
      properties:
        bucket: { type: string, format: date-time }
        command_name: { type: string }
        cli_version: { type: string, nullable: true }
        invocation_count: { type: integer }
        peak_rss_bytes:
          allOf: [{ $ref: "#/components/schemas/UsageStats" }]
          description: Peak resident set size, in bytes.
        cpu_time_ms:
          allOf: [{ $ref: "#/components/schemas/UsageStats" }]
          description: User plus system CPU time, in milliseconds.
      required: [bucket, command_name, cli_version, invocation_count, peak_rss_bytes, cpu_time_ms]

    VersionFootprintPoint:
      type: object
      properties:
        cli_version: { type: string, nullable: true, description: "null for sessions that reported no version" }
        session_count: { type: integer, description: "cli.session.started records in the window, whether or not they reported a measure." }
        binary_size_bytes:
          type: object
          description: Executable size in bytes over the sessions that reported it.
          properties:
            reported_sessions: { type: integer, description: "Sessions that reported a size; the sample size behind the figures." }
            reported_installs: { type: integer, description: "Approximate distinct installs behind those sessions (basic tier or above)." }
            median: { type: number }
            min: { type: integer }
            max: { type: integer }
          required: [reported_sessions, reported_installs]
        startup_duration_ms:
          type: object
          description: Time from process start to the command beginning to run, in milliseconds, over the sessions that reported it.
          properties:
            reported_sessions: { type: integer, description: "Sessions that reported a startup time; the sample size behind the percentiles." }
            reported_installs: { type: integer, description: "Approximate distinct installs behind those sessions (basic tier or above)." }
            p50: { type: number }
            p95: { type: number }
          required: [reported_sessions, reported_installs]
      required: [cli_version, session_count, binary_size_bytes, startup_duration_ms]

    ErrorRatePoint:
      type: object
      properties:
        bucket: { type: string, format: date-time }
        command_name: { type: string }
        invocation_count: { type: integer }
        error_count: { type: integer }
        error_rate: { type: number, description: "error_count / invocation_count" }
      required: [bucket, command_name, invocation_count, error_count, error_rate]

    FrequencyPoint:
      type: object
      properties:
        bucket: { type: string, format: date-time }
        command_name: { type: string }
        invocation_count: { type: integer }
      required: [bucket, command_name, invocation_count]

    CohortPoint:
      type: object
      properties:
        bucket: { type: string, format: date-time }
        cli_version: { type: string, nullable: true }
        os: { type: string, nullable: true }
        arch: { type: string, nullable: true }
        session_count: { type: integer }
      required: [bucket, session_count]

    ExitCodePoint:
      type: object
      properties:
        bucket: { type: string, format: date-time }
        command_name: { type: string }
        exit_code: { type: integer, nullable: true, description: "null when the client didn't report one" }
        invocation_count: { type: integer }
      required: [bucket, command_name, exit_code, invocation_count]

    ErrorTypePoint:
      type: object
      properties:
        bucket: { type: string, format: date-time }
        command_name: { type: string, nullable: true }
        error_type: { type: string, nullable: true, description: "null when the event carried no category" }
        error_count: { type: integer }
      required: [bucket, command_name, error_type, error_count]

    FrictionPoint:
      type: object
      properties:
        bucket: { type: string, format: date-time }
        command_name: { type: string, nullable: true }
        invocation_count: { type: integer }
        help_views: { type: integer }
        interrupted_count: { type: integer, description: "Invocations that exited 130 (SIGINT); a lower bound" }
      required: [bucket, command_name, invocation_count, help_views, interrupted_count]

    FunnelPoint:
      type: object
      properties:
        bucket: { type: string, format: date-time }
        installs: { type: integer }
        ran_command: { type: integer }
        succeeded: { type: integer }
      required: [bucket, installs, ran_command, succeeded]

    ActivationPoint:
      type: object
      properties:
        bucket: { type: string, format: date-time }
        cohort_size: { type: integer }
        activated_count: { type: integer }
        p50_seconds: { type: number, nullable: true }
        p90_seconds: { type: number, nullable: true }
      required: [bucket, cohort_size, activated_count, p50_seconds, p90_seconds]

    DiscoveryPoint:
      type: object
      properties:
        kind: { type: string, enum: [feature, flag] }
        name: { type: string, description: "Vendor-supplied feature name, or flag name as passed (values excluded)" }
        cohort_size: { type: integer, description: "Installs first seen in the window; the denominator for the shares" }
        installs: { type: integer, description: "Cohort installs that have ever used it" }
        discovered_within_1d: { type: integer, description: "Cohort installs whose first use was within 1 day of first_seen" }
        discovered_within_7d: { type: integer }
        discovered_within_30d: { type: integer }
        median_seconds: { type: number, description: "Median first-use minus first_seen over discoverers; negative gaps count as 0" }
      required: [kind, name, cohort_size, installs, discovered_within_1d, discovered_within_7d, discovered_within_30d, median_seconds]

    VersionChangePoint:
      type: object
      properties:
        bucket: { type: string, format: date-time }
        from_version: { type: string }
        to_version: { type: string }
        direction: { type: string, enum: [upgrade, downgrade] }
        changes: { type: integer }
        installs: { type: integer, description: "Distinct installs that made this change in the bucket" }
      required: [bucket, from_version, to_version, direction, changes, installs]

    InstallMethodPoint:
      type: object
      properties:
        bucket: { type: string, format: date-time }
        install_method: { type: string, nullable: true, description: "null for installs that never reported a method" }
        installs: { type: integer }
      required: [bucket, install_method, installs]

    NewReturningPoint:
      type: object
      properties:
        bucket: { type: string, format: date-time }
        new_installs: { type: integer, description: "Active installs first seen in this bucket" }
        returning_installs: { type: integer, description: "Active installs first seen in an earlier bucket" }
      required: [bucket, new_installs, returning_installs]

    CoveragePoint:
      type: object
      properties:
        bucket: { type: string, format: date-time }
        session_count: { type: integer }
        tracked_sessions: { type: integer, description: "Sessions that carried a cli.install_id" }
      required: [bucket, session_count, tracked_sessions]

    CISplitPoint:
      type: object
      properties:
        bucket: { type: string, format: date-time }
        is_ci: { type: boolean, nullable: true, description: "null when the client didn't report cli.is_ci" }
        invocation_count: { type: integer }
      required: [bucket, is_ci, invocation_count]

    ActiveInstallsPoint:
      type: object
      properties:
        bucket: { type: string, format: date-time }
        active_installs: { type: integer, description: "Approximate distinct cli.install_id count (HyperLogLog, ~1% error)." }
      required: [bucket, active_installs]

    RetentionPoint:
      type: object
      properties:
        cohort: { type: string, format: date-time, description: "Start of the bucket the cohort's installs were first seen in." }
        period: { type: integer, minimum: 0, description: "Buckets since the cohort bucket; 0 is the cohort bucket itself." }
        cohort_size: { type: integer, description: "Installs first seen in the cohort bucket." }
        retained_installs: { type: integer, description: "Of those, installs with a session in this period." }
      required: [cohort, period, cohort_size, retained_installs]

    Dimensions:
      type: object
      properties:
        cli_version: { type: array, items: { type: string } }
        os: { type: array, items: { type: string } }
        arch: { type: array, items: { type: string } }
        command_name: { type: array, items: { type: string } }
      required: [cli_version, os, arch, command_name]

    TenantMembership:
      type: object
      properties:
        id: { type: string, format: uuid, description: "Value to send in X-Argvio-Tenant." }
        name: { type: string }
        role: { type: string, description: "The caller's role in this tenant, e.g. viewer or admin." }
      required: [id, name, role]

    Error:
      type: object
      properties:
        error: { type: string, description: "Short machine-readable error code." }
        message: { type: string, description: "Human-readable detail." }
      required: [error, message]

  responses:
    BadRequest:
      description: >
        Invalid filter (malformed timestamp, unknown bucket value, time
        range wider than max_time_range_span, etc), or `tenant_required`: the
        caller belongs to several tenants and sent no `X-Argvio-Tenant` header.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: invalid_request, message: "requested time range 8760h0m0s exceeds max_time_range_span 2160h0m0s" }
    Unauthorized:
      description: >
        The credential is missing, invalid, expired or tampered with; the
        client should re-authenticate. Carries `WWW-Authenticate: Bearer
        error="invalid_token"` (a bare `Bearer` when no credential was sent).
      headers:
        WWW-Authenticate:
          schema: { type: string }
          example: Bearer error="invalid_token"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: unauthorized, message: "invalid or expired credential" }
    Forbidden:
      description: >
        Authenticated, but not allowed. The client must **not** re-authenticate:
        a new token would get the same answer. `error` is one of
        `no_tenant_access` (no membership at all, or `X-Argvio-Tenant` names a
        tenant the caller does not belong to), `insufficient_scope` (the token
        lacks a scope the server requires; also sent as `WWW-Authenticate:
        Bearer error="insufficient_scope"`) or `forbidden` (e.g. suspended
        tenant).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: no_tenant_access, message: "no access to the requested tenant" }
    ProviderUnavailable:
      description: >
        The OIDC provider's discovery, JWKS or introspection endpoint could not
        be reached, so the token could not be judged. Says nothing about the
        token: retry shortly; do not re-authenticate.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: provider_unavailable, message: "the identity provider could not be reached; retry shortly" }
    InternalError:
      description: Unexpected server-side failure. Detail is intentionally generic — see server logs.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: internal_error, message: "query failed" }
