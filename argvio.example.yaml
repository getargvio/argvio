# Example argvio configuration file — one document covering every
# subcommand that reads config (`serve public`, `serve metrics`, `policies
# apply`), same as ory/hydra's single hydra.yml. Every key here has a
# built-in default (see docs/configuration.md); only storage.dsn and
# auth.jwt_signing_key have no safe default and must be set somewhere
# (here, a YAML file, or the matching ARGVIO_* env var).
#
# Usage:
#   argvio --config ./argvio.example.yaml serve public
#   argvio --config ./argvio.example.yaml serve metrics
#   argvio -c base.yaml -c prod.yaml serve public   # layered: prod.yaml wins
#
# Precedence (lowest to highest): built-in defaults -> this file (later
# --config files override earlier ones) -> ARGVIO_* environment variables.

log_level: info

# Global — shared by `serve public` and `serve metrics`. Any subset of
# methods may be enabled at once (e.g. public ingest accepting both a
# generic tenant API key and a user JWT); each server still only accepts
# its own tenant API-key scope (public_ingest vs metrics_query).
auth:
  methods: [api_key, jwt] # any of: api_key, jwt, oidc
  jwt_signing_key: "change-me-in-production"
  # Only used when methods includes oidc — verifies OAuth2 access tokens from
  # a third-party OIDC provider (JWTs, and with introspection, opaque tokens).
  # A user's tenant comes from `argvio tenant member add`, not from a claim.
  # oidc:
  #   # Exactly as the provider's discovery document states it: a trailing
  #   # slash is significant.
  #   issuer_url: "https://idp.example.com"
  #   # Resource identifier of this API. Must NOT equal any SPA's client_id.
  #   audience: "https://api.example.com"
  #   required_scopes: ["metrics:read"]
  #   jwks_cache_ttl: 15m
  #   require_access_token_typ: false # true: reject a JWT whose typ isn't at+jwt
  #   trust_tenant_id_claim: false # leave off: a tenant_id claim must be a membership
  #   # Opaque access tokens (RFC 7662). Revocation at the provider takes up
  #   # to cache_ttl to be noticed.
  #   introspection:
  #     enabled: true
  #     endpoint: "" # default: the discovery document's introspection_endpoint
  #     client_id: "argvio-api"
  #     client_secret: "set via ARGVIO_AUTH__OIDC__INTROSPECTION__CLIENT_SECRET"
  #     cache_ttl: 60s
  #     negative_cache_ttl: 5s
  #
  # Admin identity (metrics server only): a verified token recognised as an
  # admin sees every active tenant with no tenant_members rows. Off unless an
  # admin recognition rule is configured; setting anything under admin: with no
  # rule is a startup error. Access tokens are verified like auth.oidc's, and
  # every field here that is left out falls back to the auth.oidc value, so the
  # same IdP and audience are reused by default. Set them to keep admin tokens
  # distinct from user tokens.
  # admin:
  #   oidc:
  #     issuer_url: ""     # default: auth.oidc.issuer_url
  #     audience: "https://admin.example.com" # default: auth.oidc.audience
  #     required_scopes: ["argvio:admin"]     # default: auth.oidc.required_scopes
  #     jwks_cache_ttl: 15m                   # default: auth.oidc.jwks_cache_ttl
  #     # introspection: same keys as auth.oidc.introspection. A different
  #     # issuer does not inherit auth.oidc's endpoint or client credentials.
  #   # Recognition rules; an identity is an admin if EITHER matches. Both read
  #   # only the verified token, so they are as trustworthy as your IdP's
  #   # control of the claim: use a dedicated group, never a user-editable one.
  #   claim:
  #     name: groups             # string or array of strings; set name AND value
  #     value: argvio-admins     # exact, case-sensitive match
  #   subjects: ["auth0|abc123"] # iss (admin issuer) + sub; restart to change
  #   # What an admin may do in every tenant: viewer (default) or admin.
  #   role: viewer
  #   role_claim: argvio_role    # optional: a valid role in this claim wins

storage:
  dsn: "postgres://postgres:postgres@localhost:5432/argvio?sslmode=disable"
  public_pool:
    max_conns: 50
    min_conns: 5
  metrics_pool:
    max_conns: 20
    min_conns: 2
  statement_timeout: 30s

public:
  grpc_listen_addr: "0.0.0.0:4317"
  http_listen_addr: "0.0.0.0:4318"
  allowlist_schema_path: "schema/allowlist/v1.yaml"
  allowlist_hot_reload: true
  # Distinct cli.error.reason values kept per tenant; new ones past the cap
  # are stored as "other" (docs/allowlist.md).
  max_error_reasons_per_tenant: 100
  # Distinct cli.counter names kept per tenant, and labels kept per name; new
  # ones past a cap are stored as "other" (docs/allowlist.md).
  max_counter_names_per_tenant: 200
  max_counter_labels_per_name: 50
  rate_limit_requests_per_second: 200
  rate_limit_bytes_per_second: 5000000
  rate_limit_burst: 400
  # Applied instead of the limits above to jwt/oidc-authenticated ingest
  # requests (e.g. a dashboard user's browser, as opposed to a service's
  # generic ingest key) — 0 means "use the limits above instead".
  # jwt_rate_limit_requests_per_second: 50
  # jwt_rate_limit_bytes_per_second: 1000000
  # jwt_rate_limit_burst: 100

metrics:
  listen_addr: "0.0.0.0:8080"
  dev_mode: false
  # Let the dashboard SPA call the API from another origin. Empty = CORS off.
  # Exact origins only (scheme://host[:port], no wildcard, no trailing slash).
  # cors:
  #   allowed_origins: ["https://dashboard.example.com"]
  #   max_age: 10m
